PublicURL: http://127.0.0.1:8080
RestLogLevel: info

IrodsHost: 127.0.0.1
IrodsPort: 1247
IrodsZone: tempZone
IrodsAdminUser: rods
IrodsAdminPassword: rods
IrodsPrimaryTestUser: test1
IrodsPrimaryTestPassword: test
IrodsSecondaryTestUser: test2
IrodsSecondaryTestPassword: test
IrodsAdminLoginType: native
IrodsAuthScheme: native
IrodsNegotiationPolicy: CS_NEG_DONT_CARE
IrodsSSLConfig:
  CACertificateFile:
  CACertificatePath:
  EncryptionKeySize: 32
  EncryptionAlgorithm: AES-256-CBC
  EncryptionSaltSize: 8
  EncryptionNumHashRounds: 16
  VerifyServer: hostname
  DHParamsFile:
  ServerName:
IrodsDefaultResource: providerResc
S3ApiSupported: true
# S3 admin endpoints require absolute host paths. Replace /absolute/path/to
# with your local irods-grid-stack checkout path.
S3BucketMappingFile: /absolute/path/to/irods-grid-stack/state/shared-s3/irods-s3-bucket-mapping.json
S3UserMappingFile: /absolute/path/to/irods-grid-stack/state/shared-s3/irods-s3-user-mapping.json
ReplicaTrimMinCopies: 1
ReplicaTrimMinAgeMinutes: 0

TestResource1: providerResc
TestResource2: resourceResc

OidcUrl: https://localhost:8443
OidcClientId: irods-go-rest
OidcClientSecret: change-me
OidcInsecureSkipVerify: true
OidcRealm: drs
OidcScope: openid profile email
TestBearerToken: ""
