  /api/v1/path/query:
    post:
      operationId: postPathQuery
      tags: [path]
      summary: Query paths by metadata or entry fields
      description: |
        Executes a metadata entry query over iRODS collections and data objects
        and returns the matches as canonical path entries. This route is for
        AVU and entry-field discovery; structural collection listings remain on
        `/api/v1/path/children`.
      security:
        - BearerAuth: []
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathQueryRequest"
            examples:
              avuDescendants:
                summary: AVU wildcard query under a collection
                value:
                  irods_path: /tempZone/home/alice
                  search_scope: descendants
                  kinds: [data_object, collection]
                  conditions:
                    - field: avu.attrib
                      op: "="
                      value: foo:bar
                    - field: avu.value
                      op: like
                      value: frog*
                  limit: 100
              avuAttribute:
                summary: AVU attribute query
                value:
                  irods_path: /tempZone/home/alice
                  search_scope: children
                  kinds: [collection]
                  conditions:
                    - field: avu.attrib
                      op: "="
                      value: iRODS:S3:BUCKET
                  include_matched_avus: true
      responses:
        "200":
          description: Query results as unified path entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathQueryResponse"
        "400":
          description: Invalid query request or page token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied for the requested query scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Query scope path not found or not a collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
