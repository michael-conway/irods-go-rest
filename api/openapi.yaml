components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    HealthResponse:
      type: object
      required: [status, service, environment]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: iRODS REST API
        environment:
          type: string
          example: development
    MetadataManifest:
      type: object
      description: |
        Generated metadata manifest for an iRODS collection or data object.
        Structure is produced by the metadata service in go-irodsclient-extensions.
      additionalProperties: true
    ServerInfo:
      type: object
      properties:
        release_version:
          type: string
          description: iRODS release version (for example `rods4.3.2`).
        api_version:
          type: string
          description: iRODS API compatibility version identifier.
        reconnect_port:
          type: integer
        reconnect_addr:
          type: string
        cookie:
          type: integer
        irods_host:
          type: string
          description: Configured iRODS hostname for this REST service.
        irods_port:
          type: integer
        irods_zone:
          type: string
        irods_negotiation:
          type: string
          enum: [CS_NEG_REFUSE, CS_NEG_REQUIRE, CS_NEG_DONT_CARE]
          description: Configured iRODS negotiation policy for this REST service.
        irods_default_resource:
          type: string
        resource_affinity:
          type: array
          items:
            type: string
          description: Optional configured list of resources proximate to this service.
    ServerInfoResponse:
      type: object
      required: [server_info]
      properties:
        server_info:
          $ref: "#/components/schemas/ServerInfo"
    PathEntry:
      type: object
      required: [id, path, kind, zone, path_segments]
      properties:
        id:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [data_object, collection]
        cmd_cues:
          type: array
          items:
            $ref: "#/components/schemas/CmdCue"
        links:
          $ref: "#/components/schemas/PathLinks"
        path_segments:
          type: array
          description: Ordered collection path segments for the path resource, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        hasChildren:
          type: boolean
        childCount:
          type: integer
          format: int32
        checksum:
          $ref: "#/components/schemas/PathChecksum"
        mime_type:
          type: string
          description: Inferred MIME type for a data object, based on the logical path extension.
        size:
          type: integer
          format: int64
        display_size:
          type: string
          description: Human-readable size formatted automatically as B, KB, MB, or GB.
        zone:
          type: string
        resource:
          type: string
        resource_link:
          $ref: "#/components/schemas/ActionLink"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/PathReplica"
        metadata:
          type: object
          additionalProperties:
            type: string
    PathReplica:
      type: object
      required: [number]
      properties:
        number:
          type: integer
          format: int64
        owner:
          type: string
        resource_name:
          type: string
        resource_link:
          $ref: "#/components/schemas/ActionLink"
        links:
          $ref: "#/components/schemas/PathReplicaLinks"
        resource_hierarchy:
          type: string
        size:
          type: integer
          format: int64
        display_size:
          type: string
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          description: Raw iRODS replica status value.
        status_symbol:
          type: string
          description: ils-style replica status indicator such as `&`, `X`, or `?`.
        status_description:
          type: string
          description: Human-readable interpretation of the replica status.
        checksum:
          type: string
        data_type:
          type: string
        physical_path:
          type: string
    CmdCue:
      type: object
      properties:
        operation:
          type: string
          enum: [put, get, phymove, replicate]
        gocmd:
          type: string
        icommand:
          type: string
    PathLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/ActionLink"
        parent:
          $ref: "#/components/schemas/ActionLink"
        children:
          $ref: "#/components/schemas/ActionLink"
        details:
          $ref: "#/components/schemas/ActionLink"
        update:
          $ref: "#/components/schemas/ActionLink"
        delete:
          $ref: "#/components/schemas/ActionLink"
        relocate:
          $ref: "#/components/schemas/ActionLink"
        move:
          $ref: "#/components/schemas/ActionLink"
        copy:
          $ref: "#/components/schemas/ActionLink"
        upload_contents:
          $ref: "#/components/schemas/ActionLink"
        replace_contents:
          $ref: "#/components/schemas/ActionLink"
        download_contents:
          $ref: "#/components/schemas/ActionLink"
        next:
          $ref: "#/components/schemas/ActionLink"
        prev:
          $ref: "#/components/schemas/ActionLink"
        add_replica:
          $ref: "#/components/schemas/ActionLink"
        move_replica:
          $ref: "#/components/schemas/ActionLink"
        trim_replica:
          $ref: "#/components/schemas/ActionLink"
        avus:
          $ref: "#/components/schemas/ActionLink"
        acls:
          $ref: "#/components/schemas/ActionLink"
        replicas:
          $ref: "#/components/schemas/ActionLink"
        create_avu:
          $ref: "#/components/schemas/ActionLink"
        create_ticket:
          $ref: "#/components/schemas/ActionLink"
        resources:
          $ref: "#/components/schemas/ActionLink"
        create_child_collection:
          $ref: "#/components/schemas/ActionLink"
        create_child_data_object:
          $ref: "#/components/schemas/ActionLink"
        set_inheritance:
          $ref: "#/components/schemas/ActionLink"
        delete_inheritance:
          $ref: "#/components/schemas/ActionLink"
    PathChildrenLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/ActionLink"
        parent:
          $ref: "#/components/schemas/ActionLink"
        next:
          $ref: "#/components/schemas/ActionLink"
        prev:
          $ref: "#/components/schemas/ActionLink"
        create_child_collection:
          $ref: "#/components/schemas/ActionLink"
        create_child_data_object:
          $ref: "#/components/schemas/ActionLink"
        upload_contents:
          $ref: "#/components/schemas/ActionLink"
    PathReplicasLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/ActionLink"
        add_replica:
          $ref: "#/components/schemas/ActionLink"
        move_replica:
          $ref: "#/components/schemas/ActionLink"
        trim_replica:
          $ref: "#/components/schemas/ActionLink"
    PathReplicaLinks:
      type: object
      properties:
        trim:
          $ref: "#/components/schemas/ActionLink"
        resource_details:
          $ref: "#/components/schemas/ActionLink"
    PathChildrenResponse:
      type: object
      required: [irods_path, path_segments, children]
      properties:
        irods_path:
          type: string
        path_segments:
          type: array
          description: Ordered collection path segments for the requested collection, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        links:
          $ref: "#/components/schemas/PathChildrenLinks"
        children:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
        search:
          $ref: "#/components/schemas/PathChildrenSearchMetadata"
    PathChildrenSearchMetadata:
      type: object
      properties:
        name_pattern:
          type: string
        recursive:
          type: boolean
        search_scope:
          type: string
          enum: [children, subtree, absolute]
        case_sensitive:
          type: boolean
        matched_count:
          type: integer
          minimum: 0
    PathQueryRequest:
      type: object
      properties:
        version:
          type: string
          description: Optional metadata query definition version. Defaults to `metadata.entry_query.v1`.
        type:
          type: string
          enum: [entry_query]
          description: Optional metadata query definition type. Defaults to `entry_query`.
        irods_path:
          type: string
          description: Absolute collection path used with `search_scope`. Use either this shortcut or `scope`, not both.
        search_scope:
          type: string
          enum: [self, children, descendants, absolute]
          default: children
          description: Query scope for `irods_path`. `descendants` searches below the scoped collection and does not include direct child data objects at the root.
        scope:
          $ref: "#/components/schemas/EntryQueryScope"
        kinds:
          type: array
          description: Entry branches to query. Empty means both collections and data objects.
          items:
            type: string
            enum: [data_object, collection]
        conditions:
          type: array
          description: ANDed query conditions expressed in the metadata entry query model.
          items:
            $ref: "#/components/schemas/EntryQueryCondition"
        defaults:
          $ref: "#/components/schemas/EntryQueryDefaults"
        replica_policy:
          type: string
          enum: [single]
          description: Data object replica handling policy. The initial route supports one logical result per data object.
        metadata:
          type: object
          additionalProperties: true
          description: Optional caller metadata preserved by durable query definitions.
        limit:
          type: integer
          minimum: 1
          description: Per-request page size override.
        page_token:
          type: string
          description: Opaque token from a previous query response page.
        include_totals:
          type: boolean
          description: Requests branch-aware total counts when supported.
        include_matched_avus:
          type: boolean
          description: Includes the AVUs that caused each entry to match.
    EntryQueryScope:
      type: object
      properties:
        root:
          type: string
          description: Absolute collection root for scoped queries.
        mode:
          type: string
          enum: [self, children, descendants, absolute]
        path_hintable:
          type: boolean
          description: Reserved for virtual collection path-hintable execution.
    EntryQueryCondition:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
          enum: [path, name, owner, data_type, resource, checksum, avu.attrib, avu.value, avu.unit]
        op:
          type: string
          enum: ["=", like]
        value:
          type: string
          description: Condition value. `like` accepts `%` or `*` wildcards.
    EntryQueryDefaults:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        include_totals:
          type: boolean
        include_matched_avus:
          type: boolean
    EntryQueryDefinition:
      type: object
      description: Durable metadata entry query definition suitable for saving and re-executing.
      properties:
        version:
          type: string
          description: Optional metadata query definition version. Defaults to `metadata.entry_query.v1`.
        type:
          type: string
          enum: [entry_query]
          description: Optional metadata query definition type. Defaults to `entry_query`.
        scope:
          $ref: "#/components/schemas/EntryQueryScope"
        kinds:
          type: array
          description: Entry branches to query. Empty means both collections and data objects.
          items:
            type: string
            enum: [data_object, collection]
        conditions:
          type: array
          description: ANDed query conditions expressed in the metadata entry query model.
          items:
            $ref: "#/components/schemas/EntryQueryCondition"
        defaults:
          $ref: "#/components/schemas/EntryQueryDefaults"
        replica_policy:
          type: string
          enum: [single]
          description: Data object replica handling policy. The initial implementation supports one logical result per data object.
        metadata:
          type: object
          additionalProperties: true
          description: Optional caller metadata preserved with the saved definition.
    SavedMetadataQueryUpsertRequest:
      type: object
      required: [query]
      properties:
        name:
          type: string
          default: New Query
          description: Optional user-facing display name. Blank or omitted values default to "New Query"; names are not required to be unique.
        description:
          type: string
          description: Optional saved query description.
        query:
          $ref: "#/components/schemas/EntryQueryDefinition"
    SavedMetadataQuery:
      type: object
      required: [version, id, name, query, created_at, updated_at]
      properties:
        version:
          type: string
          description: Saved metadata query storage version.
        id:
          type: string
          description: Opaque saved metadata query identifier. This is the stable route identity and does not change when the display name changes.
        name:
          type: string
          description: User-facing display name. This is not required to be unique.
        description:
          type: string
          description: Optional saved query description.
        query:
          $ref: "#/components/schemas/EntryQueryDefinition"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          $ref: "#/components/schemas/SavedMetadataQueryLinks"
    SavedMetadataQuerySummary:
      type: object
      required: [id, name, file_name, irods_path, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque saved metadata query identifier.
        name:
          type: string
          description: User-facing display name. This is not required to be unique.
        description:
          type: string
        file_name:
          type: string
        irods_path:
          type: string
          description: Absolute iRODS path of the stored saved-query JSON object.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          $ref: "#/components/schemas/SavedMetadataQueryLinks"
    SavedMetadataQueryLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/ActionLink"
        update:
          $ref: "#/components/schemas/ActionLink"
        delete:
          $ref: "#/components/schemas/ActionLink"
    SavedMetadataQueryResponse:
      type: object
      required: [metadata_query]
      properties:
        metadata_query:
          $ref: "#/components/schemas/SavedMetadataQuery"
    SavedMetadataQueryCollectionResponse:
      type: object
      required: [metadata_queries, count]
      properties:
        metadata_queries:
          type: array
          items:
            $ref: "#/components/schemas/SavedMetadataQuerySummary"
        count:
          type: integer
        links:
          type: object
          properties:
            self:
              $ref: "#/components/schemas/ActionLink"
            create:
              $ref: "#/components/schemas/ActionLink"
    PathQueryResponse:
      type: object
      required: [paths, page, query]
      properties:
        irods_path:
          type: string
          description: Query scope root when the request is path scoped.
        path_segments:
          type: array
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        paths:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
        matched_avus:
          type: object
          description: Optional matched AVUs keyed by canonical iRODS path. When requested with include_matched_avus=true, each AVU includes its iRODS AVU id and update/delete HATEOAS links when the id is available.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AVUMetadata"
        page:
          $ref: "#/components/schemas/PathQueryPage"
        query:
          $ref: "#/components/schemas/PathQuerySummary"
    PathQueryPage:
      type: object
      required: [limit, has_more, returned, scanned]
      properties:
        limit:
          type: integer
        has_more:
          type: boolean
        next_page_token:
          type: string
        returned:
          $ref: "#/components/schemas/PathQueryCounts"
        scanned:
          $ref: "#/components/schemas/PathQueryCounts"
        totals:
          $ref: "#/components/schemas/PathQueryCounts"
    PathQueryCounts:
      type: object
      required: [collections, data_objects]
      properties:
        collections:
          type: integer
          minimum: 0
        data_objects:
          type: integer
          minimum: 0
    PathQuerySummary:
      type: object
      required: [kinds]
      properties:
        search_scope:
          type: string
          enum: [self, children, descendants, absolute]
        scope:
          $ref: "#/components/schemas/EntryQueryScope"
        kinds:
          type: array
          items:
            type: string
            enum: [data_object, collection]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/EntryQueryCondition"
        include_totals:
          type: boolean
        include_matched_avus:
          type: boolean
    PathReplicasResponse:
      type: object
      required: [irods_path, path_segments, replicas]
      properties:
        irods_path:
          type: string
        path_segments:
          type: array
          description: Ordered collection path segments for the requested data object, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        links:
          $ref: "#/components/schemas/PathReplicasLinks"
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/PathReplica"
    PathACLResponse:
      type: object
      required: [irods_path, kind, path_segments, users, groups]
      properties:
        irods_path:
          type: string
        kind:
          type: string
          enum: [data_object, collection]
        inheritance_enabled:
          type: boolean
          description: Collection-only inheritance setting when available.
        path_segments:
          type: array
          description: Ordered collection path segments for the requested path, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        links:
          $ref: "#/components/schemas/PathACLLinks"
        users:
          type: array
          items:
            $ref: "#/components/schemas/PathACLEntry"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PathACLEntry"
    PathACLLinks:
      type: object
      properties:
        path:
          $ref: "#/components/schemas/ActionLink"
        add_user:
          $ref: "#/components/schemas/ActionLink"
        set_inheritance:
          $ref: "#/components/schemas/ActionLink"
    PathACLEntry:
      type: object
      required: [id, name, type, access_level]
      properties:
        id:
          type: string
          description: Stable ACL entry identifier for follow-up update or remove links.
        name:
          type: string
          description: iRODS user or group name.
        zone:
          type: string
          description: iRODS zone for the user or group when supplied by iRODS.
        type:
          type: string
          enum: [user, group]
          description: Principal kind derived from the iRODS user type.
        irods_user_type:
          type: string
          description: Raw iRODS user type returned with the ACL entry.
        access_level:
          type: string
          description: Raw iRODS access level for the path.
        links:
          $ref: "#/components/schemas/PathACLItemLinks"
    PathACLItemLinks:
      type: object
      properties:
        update:
          $ref: "#/components/schemas/ActionLink"
        remove:
          $ref: "#/components/schemas/ActionLink"
    PathACLCreateRequest:
      type: object
      required: [name, access_level]
      properties:
        name:
          type: string
          description: iRODS user or group principal name.
        zone:
          type: string
          description: iRODS zone for the principal. Defaults to configured zone.
        type:
          type: string
          enum: [user, group]
          description: Principal kind. Defaults to `user`.
        access_level:
          type: string
          description: Target iRODS ACL access level.
        recursive:
          type: boolean
          default: false
          description: Apply ACL change recursively when target path is a collection.
    PathACLUpdateRequest:
      type: object
      required: [access_level]
      properties:
        access_level:
          type: string
          description: Target iRODS ACL access level.
        recursive:
          type: boolean
          default: false
          description: Apply ACL change recursively when target path is a collection.
    PathACLInheritanceUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: When true enables inheritance, when false disables inheritance.
        recursive:
          type: boolean
          default: false
          description: Apply inheritance toggle recursively to nested collections.
    PathACLEntryResponse:
      type: object
      required: [irods_path, acl]
      properties:
        irods_path:
          type: string
        acl:
          $ref: "#/components/schemas/PathACLEntry"
    PathAVUResponse:
      type: object
      required: [irods_path, path_segments, avus]
      properties:
        irods_path:
          type: string
        path_segments:
          type: array
          description: Ordered collection path segments for the requested path, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        links:
          $ref: "#/components/schemas/PathLinks"
        avus:
          type: array
          items:
            $ref: "#/components/schemas/AVUMetadata"
        count:
          type: integer
          description: Number of AVUs returned after filtering and pagination.
        total:
          type: integer
          description: Number of AVUs matching the filter before pagination.
        offset:
          type: integer
          description: Number of matching AVUs skipped before returning results.
        limit:
          type: integer
          description: Requested page size, or 0 when no limit was requested.
    PathAVUSingleResponse:
      type: object
      required: [irods_path, path_segments, avu]
      properties:
        irods_path:
          type: string
        path_segments:
          type: array
          description: Ordered collection path segments for the requested path, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        avu:
          $ref: "#/components/schemas/AVUMetadata"
    UserAVUResponse:
      type: object
      required: [user_name, zone, avus]
      properties:
        user_name:
          type: string
        zone:
          type: string
        links:
          type: object
          properties:
            self:
              $ref: "#/components/schemas/ActionLink"
            create:
              $ref: "#/components/schemas/ActionLink"
        avus:
          type: array
          items:
            $ref: "#/components/schemas/AVUMetadata"
        count:
          type: integer
          description: Number of AVUs returned after filtering and pagination.
        total:
          type: integer
          description: Number of AVUs matching the filter before pagination.
        offset:
          type: integer
          description: Number of matching AVUs skipped before returning results.
        limit:
          type: integer
          description: Requested page size, or 0 when no limit was requested.
    UserAVUSingleResponse:
      type: object
      required: [user_name, zone, avu]
      properties:
        user_name:
          type: string
        zone:
          type: string
        avu:
          $ref: "#/components/schemas/AVUMetadata"
    UserGroupAVUResponse:
      type: object
      required: [group_name, zone, avus]
      properties:
        group_name:
          type: string
        zone:
          type: string
        links:
          type: object
          properties:
            self:
              $ref: "#/components/schemas/ActionLink"
            create:
              $ref: "#/components/schemas/ActionLink"
        avus:
          type: array
          items:
            $ref: "#/components/schemas/AVUMetadata"
        count:
          type: integer
          description: Number of AVUs returned after filtering and pagination.
        total:
          type: integer
          description: Number of AVUs matching the filter before pagination.
        offset:
          type: integer
          description: Number of matching AVUs skipped before returning results.
        limit:
          type: integer
          description: Requested page size, or 0 when no limit was requested.
    UserGroupAVUSingleResponse:
      type: object
      required: [group_name, zone, avu]
      properties:
        group_name:
          type: string
        zone:
          type: string
        avu:
          $ref: "#/components/schemas/AVUMetadata"
    PathChildCreateRequest:
      type: object
      required: [child_name, kind]
      properties:
        child_name:
          type: string
          description: Relative child name or relative nested path to create under the parent collection.
        kind:
          type: string
          enum: [collection, data_object]
        mkdirs:
          type: boolean
          default: false
          description: When `true`, create intermediate collection segments for collection creation.
    PathMoveRequest:
      type: object
      properties:
        operation:
          type: string
          enum: [move, copy]
          default: move
          description: Path mutation operation. Defaults to `move` when omitted.
        new_name:
          type: string
          description: New basename for rename/move within the same parent collection.
        destination_path:
          type: string
          description: Absolute destination iRODS path for move or copy operations.
      anyOf:
        - required: [new_name]
        - required: [destination_path]
    PathReplicaCreateRequest:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
          description: Destination resource name to replicate to.
        update:
          type: boolean
          default: false
          description: When true, overwrite an existing destination replica if needed.
    PathReplicaMoveRequest:
      type: object
      required: [source_resource, destination_resource]
      properties:
        source_resource:
          type: string
          description: Source resource name to trim after destination replication.
        destination_resource:
          type: string
          description: Destination resource name to receive the replica.
        update:
          type: boolean
          default: false
          description: When true, allow updating an existing destination replica.
        min_copies:
          type: integer
          minimum: 0
          description: Minimum replicas to preserve during source trim. When omitted, the service uses `ReplicaTrimMinCopies` from configuration.
        min_age_minutes:
          type: integer
          minimum: 0
          description: Minimum age threshold in minutes for trim eligibility. When omitted, the service uses `ReplicaTrimMinAgeMinutes` from configuration.
    PathReplicaTrimRequest:
      type: object
      properties:
        resource:
          type: string
          description: Resource name of the replica to trim.
        replica_number:
          type: integer
          format: int64
          description: Replica number to trim when resource is not provided.
        min_copies:
          type: integer
          minimum: 0
          description: Minimum replicas to preserve after trim. When omitted, the service uses `ReplicaTrimMinCopies` from configuration.
        min_age_minutes:
          type: integer
          minimum: 0
          description: Minimum age threshold in minutes for trim eligibility. When omitted, the service uses `ReplicaTrimMinAgeMinutes` from configuration.
      anyOf:
        - required: [resource]
        - required: [replica_number]
    PathAVUCreateRequest:
      type: object
      required: [attrib, value]
      properties:
        attrib:
          type: string
          description: AVU attribute name; must contain at least one non-whitespace character.
          pattern: "\\S"
        value:
          type: string
          description: AVU value; must contain at least one non-whitespace character.
          pattern: "\\S"
        unit:
          type: string
    PathAVUUpdateRequest:
      type: object
      description: Replacement AVU tuple for the AVU selected by the avu_id path parameter. The service resolves the current AVU by ID and performs the required iRODS old-to-new AVU replacement internally; clients do not need to send the old AVU tuple.
      required: [attrib, value]
      properties:
        attrib:
          type: string
          description: Replacement AVU attribute name; must contain at least one non-whitespace character.
          pattern: "\\S"
        value:
          type: string
          description: Replacement AVU value; must contain at least one non-whitespace character.
          pattern: "\\S"
        unit:
          type: string
    PathChecksum:
      type: object
      properties:
        checksum:
          type: string
        type:
          type: string
          description: Checksum type prefix such as `sha2` or `md5`.
    PathChecksumResponse:
      type: object
      required: [irods_path, path_segments]
      properties:
        irods_path:
          type: string
        path_segments:
          type: array
          description: Ordered collection path segments for the requested data object, each with a display name and HATEOAS link.
          items:
            $ref: "#/components/schemas/PathSegmentLink"
        checksum:
          type: string
        type:
          type: string
          description: Checksum type prefix such as `sha2` or `md5`.
    AVUMetadata:
      type: object
      required: [id, attrib, value]
      properties:
        id:
          type: string
          description: Generic identifier for the AVU row as returned by iRODS.
        attrib:
          type: string
          description: AVU attribute name.
        value:
          type: string
          description: AVU value.
        unit:
          type: string
          description: Optional AVU units value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          $ref: "#/components/schemas/AVULinks"
    AVULinks:
      type: object
      properties:
        update:
          $ref: "#/components/schemas/ActionLink"
        delete:
          $ref: "#/components/schemas/ActionLink"
    ActionLink:
      type: object
      required: [href]
      properties:
        href:
          type: string
        method:
          type: string
    PathSegmentLink:
      type: object
      required: [display_name, irods_path, href]
      properties:
        display_name:
          type: string
          description: Human-readable segment name for one level of the collection path.
        irods_path:
          type: string
          description: Canonical iRODS path up to this segment.
        href:
          type: string
          description: Relative REST link for displaying this collection level.
    PathContentsUploadRequest:
      type: object
      required: [parent_path, file_name, content]
      properties:
        parent_path:
          type: string
          description: Absolute iRODS collection path that will contain the uploaded object.
          example: /tempZone/home/alice/project
        file_name:
          type: string
          description: Target data object name within `parent_path`.
          example: sample.fastq.gz
        content:
          type: string
          format: binary
          description: Complete binary payload for the uploaded object.
        checksum:
          type: boolean
          default: false
          description: |
            When true, request checksum calculation or verification during upload.
            Future implementations may apply per-user saved defaults when this field
            is omitted, but explicit request values override saved defaults.
        overwrite:
          type: boolean
          default: false
          description: |
            When true, allow replacement of an existing object at the resolved path.
            Future implementations may apply per-user saved defaults when this field
            is omitted, but explicit request values override saved defaults.
    PathContentsUploadResponse:
      type: object
      required: [path, parent_path, file_name, action, size, links]
      properties:
        path:
          type: string
          description: Resolved canonical iRODS object path.
          example: /tempZone/home/alice/project/sample.fastq.gz
        parent_path:
          type: string
          description: Canonical parent collection path that received the uploaded object.
          example: /tempZone/home/alice/project
        file_name:
          type: string
          description: Uploaded data object name.
          example: sample.fastq.gz
        action:
          type: string
          enum: [created, replaced]
          description: Indicates whether the upload created a new object or replaced an existing object.
        size:
          type: integer
          format: int64
          description: Uploaded object size in bytes.
        checksum:
          $ref: "#/components/schemas/UploadChecksumInfo"
        links:
          $ref: "#/components/schemas/PathContentsUploadLinks"
    UploadChecksumInfo:
      type: object
      required: [requested, verified]
      properties:
        requested:
          type: boolean
          description: True when the request explicitly asked for checksum handling.
        verified:
          type: boolean
          description: True when checksum processing was completed by the server.
        algorithm:
          type: string
          description: Checksum algorithm used by the server when checksum processing was completed.
          example: sha2
        value:
          type: string
          description: Calculated or verified checksum value.
          example: 9d4e1e23bd5b727046a9e3b4b7db57bd8d6ee684
    PathContentsUploadLinks:
      type: object
      required: [path, contents, parent]
      properties:
        path:
          $ref: "#/components/schemas/ResourceLink"
        contents:
          $ref: "#/components/schemas/ResourceLink"
        parent:
          $ref: "#/components/schemas/ResourceLink"
    ResourceLink:
      type: object
      required: [href]
      properties:
        href:
          type: string
          description: Relative REST link for the related resource.
    Favorite:
      type: object
      required: [name, absolute_path]
      properties:
        name:
          type: string
          description: User-assigned favorite display name.
        absolute_path:
          type: string
          description: Absolute iRODS logical path for the favorite.
        links:
          $ref: "#/components/schemas/FavoriteLinks"
    FavoriteLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/ActionLink"
        details:
          $ref: "#/components/schemas/ActionLink"
        update:
          $ref: "#/components/schemas/ActionLink"
        delete:
          $ref: "#/components/schemas/ActionLink"
    FavoriteResponse:
      type: object
      required: [favorite]
      properties:
        favorite:
          $ref: "#/components/schemas/Favorite"
    FavoriteCollectionResponse:
      type: object
      required: [favorites, count]
      properties:
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"
        count:
          type: integer
        links:
          type: object
          properties:
            self:
              $ref: "#/components/schemas/ActionLink"
            create:
              $ref: "#/components/schemas/ActionLink"
            update:
              $ref: "#/components/schemas/ActionLink"
            delete:
              $ref: "#/components/schemas/ActionLink"
    FavoriteUpsertRequest:
      type: object
      required: [name, absolute_path]
      properties:
        name:
          type: string
          description: Favorite display name.
        absolute_path:
          type: string
          description: Absolute iRODS logical path for the favorite.
    FavoriteDeleteRequest:
      type: object
      required: [absolute_path]
