      description: |
        Generic REST surface for creating iRODS groups. Workflows that
        need to provision iRODS groups should call this route rather than an
        `/api/v1/ext` route.

        Requires the authenticated iRODS user to have type `rodsadmin` or `groupadmin`.
        Synchronization clients may use `reconcile=true` to make group creation
        repeatable when the existing principal is already an iRODS group. Created
        groups are marked with `iRODS:USER_SYNCH:MANAGED=true`.
